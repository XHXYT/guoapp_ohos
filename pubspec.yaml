name: duanju_app
description: 独立运行的多端短剧应用
publish_to: none
version: 1.0.8+108

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  ffi: ^2.2.0
  media_kit: 1.2.6
  media_kit_video: 2.0.1
  media_kit_libs_video: ^1.0.7
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  flutter_foreground_task: 11.0.3
  # FFmpegKit 鸿蒙适配（ohos_ffmpeg_kit，含 arm64 预编译 FFmpeg 6.0）
  #   代码 import 'package:ffmpeg_kit_flutter_new_min_gpl/...'
  #   → import 'package:ffmpeg_kit_flutter/...'（FFmpegKit/FFprobeKit/ReturnCode API 不变）
  ffmpeg_kit_flutter:
    git:
      url: https://gitcode.com/CPF-ApplicationTPC/ohos_ffmpeg_kit.git
      path: flutter/flutter
      ref: master
  # file_picker 鸿蒙适配（包名改为 file_picker_ohos，基于 10.3.8）
  #   代码 import 'package:file_picker/file_picker.dart'
  #   → import 'package:file_picker_ohos/file_picker_ohos.dart'
  #   （调用改为 FilePicker.platform.*，v13 的静态方法 API 不再可用）
  file_picker_ohos:
    git:
      url: https://gitcode.com/hellozeronick/fluttertpc_file_picker.git
      ref: br_v10.3.8_ohos
  crypto: ^3.0.7
  window_manager: ^0.5.1
  package_info_plus: ^10.2.1
  # 1.9.0（iwrqk 验证版本）：2.x 依赖 material_ui/cupertino_ui，
  # 其穷举 switch 与 ohos fork 的 TargetPlatform.ohos 冲突，无法编译
  dynamic_color: ^1.9.0
  url_launcher: ^6.3.3
  lpinyin: ^2.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

dependency_overrides:
  media_kit_libs_windows_video:
    path: packages/media_kit_libs_windows_video
  shared_preferences_windows:
    path: packages/shared_preferences_windows
  # ---- media_kit（iwrqk 已验证的 ErBWs feat-ohos，libmpv 鸿蒙预编译）----
  media_kit:
    git:
      url: https://github.com/ErBWs/media-kit.git
      ref: feat-ohos
      path: media_kit
  media_kit_video:
    git:
      url: https://github.com/ErBWs/media-kit.git
      ref: feat-ohos
      path: media_kit_video
  media_kit_libs_video:
    git:
      url: https://github.com/ErBWs/media-kit.git
      ref: feat-ohos
      path: libs/universal/media_kit_libs_video
  media_kit_libs_ohos:
    git:
      url: https://github.com/ErBWs/media-kit.git
      ref: feat-ohos
      path: libs/ohos/media_kit_libs_ohos
  # ---- 基础插件 ohos 适配 ----
  path_provider:
    git:
      url: https://gitcode.com/openharmony-tpc/flutter_packages.git
      path: packages/path_provider/path_provider
      ref: br_path_provider-v2.1.5_ohos
  shared_preferences:
    git:
      url: https://gitcode.com/openharmony-tpc/flutter_packages.git
      path: packages/shared_preferences/shared_preferences
      ref: br_shared_preferences-v2.5.4_ohos
  url_launcher:
    git:
      url: https://gitcode.com/hellozeronick/url_launcher.git
      path: url_launcher
      ref: main
  package_info_plus:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_plus_plugins.git
      path: packages/package_info_plus/package_info_plus
      ref: package_info_plus-9.0.0-ohos-1.0.0

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
